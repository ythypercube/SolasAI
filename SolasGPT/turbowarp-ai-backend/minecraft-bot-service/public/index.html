<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolasAI Bot Service</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Inter, system-ui, Arial, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; }
    .wrap { max-width: 920px; margin: 28px auto; padding: 0 16px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    h1 { margin: 0 0 14px 0; font-size: 24px; }
    h2 { margin: 0 0 10px 0; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    label { display: block; font-size: 12px; color: #9da7b3; margin-bottom: 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; padding: 9px 10px; }
    textarea { min-height: 84px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button { background: #238636; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    button.secondary { background: #1f6feb; }
    button.danger { background: #da3633; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; overflow: auto; max-height: 280px; }
    .hint { font-size: 12px; color: #8b949e; margin-top: 8px; }
    .ok { color: #3fb950; }
    .err { color: #f85149; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SolasAI Autonomous Bot Service</h1>

    <div class="card">
      <h2>Backend (Render /mc-agent)</h2>
      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" placeholder="https://your-render-service.onrender.com/mc-agent" />
      <div class="row">
        <button id="saveBackend" class="secondary">Save Backend URL</button>
      </div>
      <div class="hint">Use your deployed Render endpoint here. Local default is http://127.0.0.1:8787/mc-agent.</div>
    </div>

    <div class="card">
      <h2>Bot Start</h2>
      <div class="grid">
        <div>
          <label for="host">Server Host</label>
          <input id="host" placeholder="solasai.aternos.net" />
        </div>
        <div>
          <label for="port">Server Port</label>
          <input id="port" type="number" value="25565" />
        </div>
        <div>
          <label for="username">Bot Username</label>
          <input id="username" value="SolasAI" />
        </div>
        <div>
          <label for="auth">Auth</label>
          <select id="auth">
            <option value="offline">offline</option>
            <option value="microsoft">microsoft</option>
            <option value="mojang">mojang</option>
          </select>
        </div>
      </div>
      <label for="objective" style="margin-top:10px;">Objective</label>
      <textarea id="objective">general1</textarea>
      <div class="row">
        <button id="startBtn">Start Bot</button>
        <button id="stopBtn" class="danger">Stop Bot</button>
        <button id="setObjectiveBtn" class="secondary">Update Objective</button>
        <button id="refreshBtn" class="secondary">Refresh Status</button>
      </div>
      <div id="statusMsg" class="hint"></div>
    </div>

    <div class="card">
      <h2>Status</h2>
      <pre id="statusOut">Loading...</pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(path, method = 'GET', body = null) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { ok: false, error: text }; }
      if (!res.ok) throw new Error(data.error || `${method} ${path} failed`);
      return data;
    }

    function setMessage(text, ok = true) {
      const el = $('statusMsg');
      el.textContent = text;
      el.className = ok ? 'hint ok' : 'hint err';
    }

    async function refreshStatus() {
      try {
        const backend = await api('/backend');
        $('backendUrl').value = backend.backendUrl || '';
      } catch {}

      try {
        const status = await api('/status');
        $('statusOut').textContent = JSON.stringify(status, null, 2);
      } catch (err) {
        $('statusOut').textContent = String(err.message || err);
      }
    }

    $('saveBackend').addEventListener('click', async () => {
      try {
        const backendUrl = $('backendUrl').value.trim();
        await api('/backend', 'POST', { backendUrl });
        setMessage('Backend URL saved.', true);
        refreshStatus();
      } catch (err) {
        setMessage(err.message || 'Failed to save backend URL', false);
      }
    });

    $('startBtn').addEventListener('click', async () => {
      try {
        const payload = {
          host: $('host').value.trim(),
          port: Number($('port').value || 25565),
          username: $('username').value.trim(),
          auth: $('auth').value,
          objective: $('objective').value.trim(),
          backendUrl: $('backendUrl').value.trim() || undefined
        };
        const result = await api('/start', 'POST', payload);
        setMessage(`Bot start requested: ${result.username}@${result.host}:${result.port}`, true);
        refreshStatus();
      } catch (err) {
        setMessage(err.message || 'Failed to start bot', false);
      }
    });

    $('stopBtn').addEventListener('click', async () => {
      try {
        await api('/stop', 'POST', {});
        setMessage('Bot stopped.', true);
        refreshStatus();
      } catch (err) {
        setMessage(err.message || 'Failed to stop bot', false);
      }
    });

    $('setObjectiveBtn').addEventListener('click', async () => {
      try {
        await api('/objective', 'POST', { objective: $('objective').value.trim() });
        setMessage('Objective updated.', true);
        refreshStatus();
      } catch (err) {
        setMessage(err.message || 'Failed to update objective', false);
      }
    });

    $('refreshBtn').addEventListener('click', refreshStatus);

    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
