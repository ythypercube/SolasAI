plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def buildStamp = new Date().format('yyyyMMddHHmmss')
version = "${project.mod_version}+build.${buildStamp}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "solasai-fabric-agent" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.register("buildChatMod") {
    group = "build"
    description = "Builds a separate chat-focused mod jar with auto-reply enabled by default."
    dependsOn tasks.named("remapJar")

    doLast {
        File remappedJar = tasks.named("remapJar").get().archiveFile.get().asFile
        File workDir = file("$buildDir/chat-mod-work")
        File outputJar = file("$buildDir/libs/${project.archives_base_name}-chat-${project.version}.jar")

        delete(workDir)
        mkdir(workDir)

        copy {
            from zipTree(remappedJar)
            into workDir
        }

        File modJsonFile = new File(workDir, "fabric.mod.json")
        def modJson = new JsonSlurper().parse(modJsonFile)
        modJson.id = "solasai_fabric_chat_agent"
        modJson.name = "SolasAI Fabric Chat Agent"
        modJson.description = "Chat-focused SolasAI build. AI can reply to chat mentions and /solasai ask prompts."

        modJsonFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(modJson)) + "\n"

        File profileFlag = new File(workDir, "solasai-chat-profile.flag")
        profileFlag.text = "chat-profile\n"

        delete(outputJar)
        ant.zip(destfile: outputJar, basedir: workDir)

        logger.lifecycle("Built chat mod jar: ${outputJar}")
    }
}

tasks.named("build") {
    dependsOn(tasks.named("buildChatMod"))
}
